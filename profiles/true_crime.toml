[niche]
name = "True Crime & Cold Cases"
slug = "true_crime"
description = "Forensic paradoxes, baffling missing persons cases, and unsolvable historical crimes"
language = "en"

[video_target]
min_duration = 62.0
max_duration = 75.0
min_words = 170
max_words = 195

[series]
enabled = true
current_arc = "Vanished Into Thin Air: The Most Baffling Cold Cases"
current_episode = 1
total_episodes = 5
episodes = [ "The Yuba County Five Disappearance", "The DB Cooper Skyjacking", "The Somerton Man Tamam Shud Mystery", "The Hinterkaifeck Murders", "The Isdal Woman Cold Case",]

[llm]
provider = "deepseek"
model = "deepseek-chat"

[persona]
tone = "forensic, haunting, cold documentary suspense"
hook_style = "paradox_or_shock"
banned_phrases = [ "in today's video", "dive into", "welcome back", "hit that subscribe button",]

[voice]
provider = "edge"
voice_name = "en-US-ChristopherNeural"
voice_rate = 1.12
voice_volume = 1.0

[visual]
aspect_ratio = "9:16"
source = "pexels"
clip_duration = 2.8
transition_mode = "fade"
concat_mode = "sequential"
negative_keywords = [ "food", "chef", "party", "kebab", "comedy", "meal", "eating", "dining", "restaurant", "market", "meat", "dish", "shawarma", "groceries", "cartoon", "breakfast", "snack", "lunch", "resort", "kitchen", "dinner", "swimming", "culinary", "recipe", "cooking", "grill", "beach",]

[subtitle]
font_name = "Montserrat-Black.ttf"
enabled = true
position = "custom"
custom_position = 70.0
font_size = 54
stroke_width = 4
color = "#FFFFFF"
highlight_color = "#FF2A2A"
text_background_color = "#000000"
rounded_subtitle_background = true

[audio]
bgm_type = "random"
bgm_volume = 0.18
bgm_ducking = true
bgm_ducking_volume = 0.08
