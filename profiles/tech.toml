# ==============================================================================
# Niche Profile: Tech & Future Automation
# ==============================================================================

[niche]
name = "Tech & Future Automation"
slug = "tech"
description = "Silicon secrets, underground hardware hacks, AI breakthroughs, and forgotten computing history"
language = "en"

[series]
enabled = true
current_arc = "The Hidden Chip War Behind Modern AI"
current_episode = 1
total_episodes = 3

[llm]
provider = "ollama"
model = "qwen3-coder-agent:latest"

[persona]
tone = "fast-paced, analytical, mind-blowing tech documentary, investigative"
hook_style = "paradox_or_shock"
banned_phrases = [
    "in today's video",
    "dive into",
    "let's explore",
    "welcome back",
    "hit that subscribe button",
    "have you ever wondered",
    "in a world where"
]

[voice]
provider = "edge"
voice_name = "en-US-GuyNeural"
voice_rate = 1.05
voice_volume = 1.0

[visual]
aspect_ratio = "9:16"
source = "pexels"
clip_duration = 2.8
transition_mode = "fade"
concat_mode = "sequential"

[subtitle]
enabled = true
position = "custom"
custom_position = 72.0
font_name = "Montserrat-Black.ttf"
font_size = 54
stroke_width = 2
color = "#FFFFFF"
highlight_color = "#00FFCC"
text_background_color = "#000000"
rounded_subtitle_background = true

[audio]
bgm_type = "random"
bgm_volume = 0.16
bgm_ducking = true
bgm_ducking_volume = 0.08
