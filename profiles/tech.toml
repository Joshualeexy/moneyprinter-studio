[niche]
name = "Future Tech"
slug = "tech"
description = "The secret hardware wars, underground infrastructure, and artificial intelligence singularity"
language = "en"

[video_target]
min_duration = 50.0
max_duration = 60.0
min_words = 115
max_words = 130

[series]
enabled = true
current_arc = "The Hidden Chip War Behind Modern AI"
current_episode = 1
total_episodes = 5
episodes = [ "The Secret CIA Chip Fab Built In 1984", "Quantum Supremacy: Breaking Global Encryption", "The Deep Underground Cables Powering The Internet", "Autonomous Drone Swarms in Modern Warfare", "The Secret Silicon Vault in the Mojave Desert",]

[llm]
provider = "deepseek"
model = "deepseek-chat"

[persona]
tone = "high stakes, breathless investigative techno-thriller"
hook_style = "paradox_or_shock"
banned_phrases = [ "in today's video", "dive into", "welcome back", "hit that subscribe button",]

[voice]
provider = "edge"
voice_name = "en-US-ChristopherNeural"
voice_rate = 1.12
voice_volume = 1.0

[visual]
aspect_ratio = "9:16"
source = "pexels"
clip_duration = 2.8
transition_mode = "fade"
concat_mode = "sequential"
negative_keywords = [ "food", "chef", "nature", "party", "kebab", "meal", "eating", "dining", "restaurant", "market", "meat", "dish", "shawarma", "groceries", "cartoon", "breakfast", "forest", "snack", "lunch", "kitchen", "dinner", "culinary", "recipe", "cooking", "grill", "beach",]

[subtitle]
font_name = "Montserrat-Black.ttf"
enabled = true
position = "custom"
custom_position = 70.0
font_size = 54
stroke_width = 4
color = "#FFFFFF"
highlight_color = "#00E5FF"
text_background_color = "#000000"
rounded_subtitle_background = true

[audio]
bgm_type = "random"
bgm_volume = 0.18
bgm_ducking = true
bgm_ducking_volume = 0.08
