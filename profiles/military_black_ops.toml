[niche]
name = "Military Black Ops & Skunkworks"
slug = "military_black_ops"
description = "Declassified dark budget black projects, experimental stealth weapons, and clandestine military programs"
language = "en"

[video_target]
min_duration = 65.0
max_duration = 75.0
min_words = 160
max_words = 185

[series]
enabled = true
current_arc = "Declassified Pentagon Black Budget Programs"
current_episode = 1
total_episodes = 5
episodes = [
    "Project Pluto: The Unstoppable Nuclear-Powered Ramjet Missile",
    "Lockheed Skunk Works and The Secret SR-71 Radar Invisibility Coat",
    "Project Azorian: The CIA's Secret Heist of a Soviet Nuclear Submarine",
    "Operation Starfish Prime: When the US Detonated a Nuke in Orbit",
    "The Acoustic Kitty: The CIA's Failed Cybernetic Animal Spy"
]

[llm]
provider = "deepseek"
model = "deepseek-chat"

[persona]
tone = "gritty, fast-paced, high-stakes military espionage thriller"
hook_style = "paradox_or_shock"
banned_phrases = ["in today's video", "dive into", "welcome back", "hit that subscribe button"]

[voice]
provider = "edge"
voice_name = "en-US-ChristopherNeural"
voice_rate = 1.0
voice_volume = 1.0

[visual]
aspect_ratio = "9:16"
source = "pexels"
clip_duration = 2.8
transition_mode = "fade"
concat_mode = "sequential"
negative_keywords = ["beach", "bikini", "resort", "vacation", "party", "food", "cooking", "meat", "eating", "restaurant", "chef", "shawarma", "kebab", "market", "grill", "dish", "culinary", "kitchen", "recipe", "cartoon"]

[subtitle]
font_name = "Montserrat-Black.ttf"
enabled = true
position = "custom"
custom_position = 70.0
font_size = 54
stroke_width = 4
color = "#FFFFFF"
highlight_color = "#39FF14"
text_background_color = "#000000"
rounded_subtitle_background = true

[audio]
bgm_type = "random"
bgm_volume = 0.18
bgm_ducking = true
bgm_ducking_volume = 0.08
