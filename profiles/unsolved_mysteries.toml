[niche]
name = "Unsolved Global Mysteries"
slug = "unsolved_mysteries"
description = "Bizarre unexplained historical events, missing expeditions, and creepy global anomalies"
language = "en"

[video_target]
min_duration = 62.0
max_duration = 75.0
min_words = 170
max_words = 195

[series]
enabled = true
current_arc = "Creepy Unsolved Cold Cases of the World"
current_episode = 1
total_episodes = 5
episodes = [
    "The 1959 Dyatlov Pass Incident: Radiation and Crushed Bones",
    "The 1908 Tunguska Event: The Megaton Blast with No Crater",
    "Cicada 3301: The Dark Web Puzzle That Vanished Overnight",
    "The Lost Colony of Roanoke and The Croatoan Carving",
    "The Disappearance of Flight 19 in The Bermuda Triangle"
]

[llm]
provider = "deepseek"
model = "deepseek-chat"

[persona]
tone = "unsettling, investigative, chilling, razor-sharp narrative tension"
hook_style = "paradox_or_shock"
banned_phrases = ["in today's video", "dive into", "welcome back", "hit that subscribe button"]

[voice]
provider = "elevenlabs"
voice_name = "elevenlabs:Xb7hH8MSUJpSbSDYk0k2:Alice"
voice_rate = 1.12
voice_volume = 1.0

[visual]
aspect_ratio = "9:16"
source = "pexels"
clip_duration = 2.8
transition_mode = "fade"
concat_mode = "sequential"
negative_keywords = ["beach", "bikini", "resort", "vacation", "party", "food", "cooking", "meat", "eating", "restaurant", "chef", "shawarma", "kebab", "market", "grill", "dish", "culinary", "kitchen", "recipe", "cartoon"]

[subtitle]
font_name = "Montserrat-Black.ttf"
enabled = true
position = "custom"
custom_position = 70.0
font_size = 54
stroke_width = 4
color = "#FFFFFF"
highlight_color = "#00E5FF"
text_background_color = "#000000"
rounded_subtitle_background = true

[audio]
bgm_type = "random"
bgm_volume = 0.18
bgm_ducking = true
bgm_ducking_volume = 0.08
