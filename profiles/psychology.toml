[niche]
name = "Dark Psychology"
slug = "psychology"
description = "Declassified behavioral experiments, psychological paradoxes, and covert social conditioning"
language = "en"

[video_target]
min_duration = 50.0
max_duration = 60.0
min_words = 115
max_words = 130

[series]
enabled = true
current_arc = "The Darkest Declassified Mind Control Experiments"
current_episode = 1
total_episodes = 5
episodes = [
    "Project MK-Ultra and Subproject 68",
    "The Monster Study: The Forbidden Stuttering Experiment",
    "The 1971 Stanford Prison Experiment Breakdown",
    "The Third Wave: Fascism in a High School Classroom",
    "The Aversion Project and Military Behavioral Conditioning"
]

[llm]
provider = "deepseek"
model = "deepseek-chat"

[persona]
tone = "clinical, chilling, forensic documentary psychological suspense"
hook_style = "paradox_or_shock"
banned_phrases = ["in today's video", "dive into", "welcome back", "hit that subscribe button"]

[voice]
provider = "edge"
voice_name = "en-US-ChristopherNeural"
voice_rate = 1.12
voice_volume = 1.0

[visual]
aspect_ratio = "9:16"
source = "pexels"
clip_duration = 2.8
transition_mode = "fade"
concat_mode = "sequential"
negative_keywords = ["beach", "bikini", "resort", "vacation", "party", "food", "cooking", "meat", "eating", "restaurant", "chef", "shawarma", "kebab", "market", "grill", "dish", "culinary", "kitchen", "recipe"]

[subtitle]
font_name = "Montserrat-Black.ttf"
enabled = true
position = "custom"
custom_position = 70.0
font_size = 54
stroke_width = 4
color = "#FFFFFF"
highlight_color = "#FFD700"
text_background_color = "#000000"
rounded_subtitle_background = true

[audio]
bgm_type = "random"
bgm_volume = 0.18
bgm_ducking = true
bgm_ducking_volume = 0.08
