[niche]
name = "Lost Cataclysms & Myth"
slug = "mythology"
description = "Forgotten prehistoric cataclysms, ancient mega-flood evidence, and mythological origin points"
language = "en"

[video_target]
min_duration = 65.0
max_duration = 75.0
min_words = 160
max_words = 185

[series]
enabled = true
current_arc = "Forgotten Cataclysms That Shaped Human Myth"
current_episode = 1
total_episodes = 5
episodes = [
    "The Younger Dryas Comet Impact and the Great Flood",
    "The Minoan Eruption of Thera and the Atlantis Legend",
    "The Lake Toba Bottleneck That Nearly Extinguished Humanity",
    "Gobekli Tepe: The Temple Built Before Agriculture",
    "The Richat Structure: The Eye of the Sahara"
]

[llm]
provider = "deepseek"
model = "deepseek-chat"

[persona]
tone = "epic, monumental, ancient earth investigative documentary"
hook_style = "paradox_or_shock"
banned_phrases = ["in today's video", "dive into", "welcome back", "hit that subscribe button"]

[voice]
provider = "edge"
voice_name = "en-US-ChristopherNeural"
voice_rate = 1.0
voice_volume = 1.0

[visual]
aspect_ratio = "9:16"
source = "pexels"
clip_duration = 2.8
transition_mode = "fade"
concat_mode = "sequential"
negative_keywords = ["beach", "bikini", "resort", "vacation", "party", "food", "cooking", "meat", "eating", "restaurant", "chef", "shawarma", "kebab", "market", "grill", "dish", "culinary", "kitchen", "recipe"]

[subtitle]
font_name = "Montserrat-Black.ttf"
enabled = true
position = "custom"
custom_position = 70.0
font_size = 54
stroke_width = 4
color = "#FFFFFF"
highlight_color = "#FFD700"
text_background_color = "#000000"
rounded_subtitle_background = true

[audio]
bgm_type = "random"
bgm_volume = 0.18
bgm_ducking = true
bgm_ducking_volume = 0.08
