[niche]
name = "Ancient Mysteries"
slug = "ancient"
description = "Forbidden ancient inventions, lost high technology, and suppressed archaeological anomalies"
language = "en"

[video_target]
min_duration = 62.0
max_duration = 75.0
min_words = 170
max_words = 195

[series]
enabled = true
current_arc = "Lost High Technology of the Ancients"
current_episode = 1
total_episodes = 3
episodes = [ "The Baghdad Battery and Ancient Electricity", "Greek Fire: The Byzantines Lost Superweapon", "The Antikythera Mechanism: A 2000 Year Old Computer",]

[llm]
provider = "deepseek"
model = "deepseek-chat"

[persona]
tone = "suspenseful, authoritative investigative documentary"
hook_style = "paradox_or_shock"
banned_phrases = [ "in today's video", "dive into", "welcome back", "let's explore", "hit that subscribe button",]

[voice]
provider = "edge"
voice_name = "en-US-ChristopherNeural"
voice_rate = 1.12
voice_volume = 1.0

[visual]
aspect_ratio = "9:16"
source = "pexels"
clip_duration = 2.8
transition_mode = "fade"
concat_mode = "sequential"
negative_keywords = [ "food", "chef", "party", "kebab", "comedy", "meal", "eating", "dining", "restaurant", "market", "bikini", "meat", "dish", "shawarma", "groceries", "cartoon", "breakfast", "vacation", "snack", "lunch", "resort", "kitchen", "dinner", "culinary", "recipe", "cooking", "grill", "beach",]

[subtitle]
font_name = "Montserrat-Black.ttf"
enabled = true
position = "custom"
custom_position = 70.0
font_size = 54
stroke_width = 4
color = "#FFFFFF"
highlight_color = "#FFD700"
text_background_color = "#000000"
rounded_subtitle_background = true

[audio]
bgm_type = "random"
bgm_volume = 0.18
bgm_ducking = true
bgm_ducking_volume = 0.08
